<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 【替換】主字 -->
<title>圖解識字｜休</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== 圖解識字 Claude 版範本（16:9，1920×1080） =====
   版面固定，不要改 CSS；只替換標有【替換】的內容與 SVG 插圖。 */
:root{
  --ink:#1f2328;            /* 深黑中性筆 */
  --grid:#cfe3f2;           /* 方格線 */
  --paper:#fdfdf8;
  --hl-yellow:#fff27a;      /* 螢光黃 */
  --hl-pink:#ffb3d1;        /* 螢光粉 */
  --hl-green:#a8f0b5;       /* 螢光綠 */
  --hl-blue:#a9dcff;        /* 螢光藍 */
  --hl-orange:#ffcf8a;      /* 螢光橘 */
  --mk-blue:#1e6fd9;        /* 形旁：藍色圈 */
  --mk-green:#14a44d;       /* 聲旁：綠色圈 */
  --mk-red:#e5484d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#e9edf1;font-family:"LXGW WenKai TC","DFKai-SB","BiauKai","標楷體",serif;color:var(--ink)}
.stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.page{
  width:1920px;height:1080px;flex:none;position:relative;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1.5px,transparent 1.5px),
    linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
  background-size:40px 40px;background-position:-1px -1px;
  box-shadow:0 10px 40px rgba(0,0,0,.18);
  padding:36px 56px 44px;
  display:grid;grid-template-rows:130px 400px minmax(0,1fr);gap:24px;
  transform-origin:center center;
}
/* 頂部主標題 */
.title{display:flex;align-items:center;justify-content:center;gap:28px}
.title .main{
  font-size:132px;font-weight:700;line-height:1;position:relative;padding:0 26px;
}
.title .main::before{ /* 螢光筆底色 */
  content:"";position:absolute;left:0;right:0;bottom:8px;height:58px;
  background:var(--hl-yellow);border-radius:14px;z-index:-1;transform:rotate(-1.5deg);
}
.title .main{z-index:0}
/* 上方主區塊：拆解圖解＋角色對話 */
.analysis{
  border:4px solid var(--ink);border-radius:26px;background:rgba(255,255,255,.72);
  display:grid;grid-template-columns:1.15fr 1fr;gap:20px;padding:18px 26px;position:relative;
}
.analysis .diagram{display:flex;align-items:center;justify-content:center}
.analysis .talk{display:flex;align-items:center;gap:8px}
.bubble{
  position:relative;background:#fff;border:3.5px solid var(--ink);border-radius:30px;
  padding:26px 30px;font-size:42px;line-height:1.5;flex:1;
}
.bubble::after{ /* 對話框尾巴，指向右側角色 */
  content:"";position:absolute;right:-26px;top:58%;width:30px;height:30px;background:#fff;
  border-right:3.5px solid var(--ink);border-bottom:3.5px solid var(--ink);
  transform:rotate(-45deg);
}
.bubble .rhyme{display:block;margin-top:10px;font-size:46px;font-weight:700}
.hl{padding:0 6px;border-radius:8px}
.hl.y{background:var(--hl-yellow)} .hl.p{background:var(--hl-pink)} .hl.g{background:var(--hl-green)}
.hl.b{background:var(--hl-blue)} .hl.o{background:var(--hl-orange)}
/* 下方四區塊 */
.blocks{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.card{
  border:3.5px solid var(--ink);border-radius:22px;background:rgba(255,255,255,.75);
  padding:14px 20px 16px;display:flex;min-height:0;overflow:hidden;flex-direction:column;position:relative;
}
.card .tag{
  align-self:flex-start;font-size:32px;font-weight:700;padding:2px 16px;border-radius:10px;
  transform:rotate(-2deg);margin-bottom:6px;
}
.card .word{font-size:46px;font-weight:700;text-align:center;letter-spacing:4px}
.card .pic{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.card .pic svg{height:100%;max-height:150px;width:auto}
.card .sent{font-size:29px;line-height:1.45;border-top:3px dashed #9aa4ad;padding-top:8px}
.card .sent b{color:var(--mk-red);font-weight:700}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff}
  .stage{width:auto;height:auto;display:block}
  .page{box-shadow:none;transform:none!important;zoom:.584;
        -webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="stage"><div class="page" id="page">

  <!-- 頂部主標題：只放主字，不加編號 -->
  <header class="title">
    <div class="main">休</div><!-- 【替換】主字 -->
  </header>

  <!-- 上方主區塊：不要印任何區塊名稱，直接放拆解圖解＋角色對話 -->
  <section class="analysis">
    <div class="diagram">
      <!-- 【替換】部件／字源拆解圖。
           會意、象形：畫本義情境；形聲：形旁用藍圈（--mk-blue）、聲旁用綠圈（--mk-green）；
           聯想：畫誇張好笑的小故事；抽象高頻：多格日常情境，把字藏成角色或印章。 -->
      <svg viewBox="0 0 900 400" width="830" height="369" aria-label="亻加木等於休">
        <g font-family="LXGW WenKai TC, DFKai-SB, serif" font-weight="700" text-anchor="middle">
          <!-- 部件一：亻（人） -->
          <circle cx="120" cy="110" r="84" fill="#fff" stroke="#1e6fd9" stroke-width="7"/>
          <text x="120" y="148" font-size="112" fill="#1f2328">亻</text>
          <text x="120" y="232" font-size="36" fill="#1e6fd9">人</text>
          <use href="#kid-boy" x="62" y="248" width="116" height="146"/>
          <!-- ＋ -->
          <text x="262" y="150" font-size="90" fill="#e5484d">＋</text>
          <!-- 部件二：木（樹） -->
          <circle cx="404" cy="110" r="84" fill="#fff" stroke="#14a44d" stroke-width="7"/>
          <text x="404" y="148" font-size="112" fill="#1f2328">木</text>
          <text x="404" y="232" font-size="36" fill="#14a44d">樹</text>
          <use href="#tree" x="346" y="240" width="116" height="156"/>
          <!-- ＝ -->
          <text x="548" y="150" font-size="90" fill="#e5484d">＝</text>
          <!-- 合起來：人靠在樹旁 -->
          <rect x="620" y="20" width="262" height="368" rx="26" fill="#fff8c4" stroke="#1f2328" stroke-width="4"/>
          <use href="#tree" x="690" y="58" width="180" height="250"/>
          <use href="#kid-rest" x="628" y="150" width="140" height="170"/>
          <text x="751" y="368" font-size="58" fill="#1f2328">休</text>
          <!-- 箭頭標記 -->
          <path d="M 700 140 q -30 -40 10 -80" fill="none" stroke="#e5484d" stroke-width="5" marker-end="url(#arrow)"/>
        </g>
      </svg>
    </div>
    <div class="talk">
      <div class="bubble">
        <!-- 【替換】白話記憶口訣，強調用「」與螢光筆，不用雙星號 -->
        走累了，<span class="hl b">人</span>靠在<span class="hl g">大樹</span>旁邊，
        就是在「休」息喔！
        <span class="rhyme">口訣：<span class="hl y">人靠樹，休一休</span></span>
      </div>
      <svg viewBox="0 0 160 300" width="150" height="281" aria-hidden="true"><use href="#teacher" width="160" height="300"/></svg>
    </div>
  </section>

  <!-- 下方四區塊：保留四個中文小標題 -->
  <section class="blocks">
    <div class="card">
      <span class="tag hl y">原始字義</span>
      <div class="word">休息</div><!-- 【替換】 -->
      <div class="pic">
        <svg viewBox="0 0 260 170" aria-hidden="true">
          <rect x="0" y="140" width="260" height="30" rx="10" fill="#c9ecb4"/>
          <use href="#tree" x="120" y="0" width="120" height="160"/>
          <use href="#kid-rest" x="40" y="44" width="104" height="124"/>
          <text x="40" y="40" font-size="30" fill="#1e6fd9" font-family="sans-serif">z z</text>
        </svg>
      </div>
      <p class="sent">小明跑累了，坐在樹下<b>休息</b>。</p><!-- 【替換】 -->
    </div>
    <div class="card">
      <span class="tag hl g">常見語詞</span>
      <div class="word">休假</div>
      <div class="pic">
        <svg viewBox="0 0 260 170" aria-hidden="true">
          <rect x="0" y="118" width="260" height="52" fill="#7cc8f2"/>
          <rect x="0" y="140" width="260" height="30" fill="#f4dca0"/>
          <use href="#sun" x="190" y="4" width="60" height="60"/>
          <path d="M60 142 L60 40" stroke="#1f2328" stroke-width="5"/>
          <path d="M10 62 Q60 0 110 62 Z" fill="#ff8a65" stroke="#1f2328" stroke-width="4"/>
          <use href="#kid-girl" x="120" y="54" width="80" height="108"/>
          <use href="#kid-boy" x="180" y="62" width="70" height="100"/>
        </svg>
      </div>
      <p class="sent">爸爸<b>休假</b>，帶我們去海邊玩。</p>
    </div>
    <div class="card">
      <span class="tag hl b">抽象語詞</span>
      <div class="word">退休</div>
      <div class="pic">
        <svg viewBox="0 0 260 170" aria-hidden="true">
          <rect x="0" y="140" width="260" height="30" rx="10" fill="#c9ecb4"/>
          <use href="#grandpa" x="30" y="20" width="110" height="146"/>
          <g transform="translate(160 86)">
            <path d="M10 54 L70 54 L62 84 L18 84 Z" fill="#c97a4a" stroke="#1f2328" stroke-width="4"/>
            <path d="M40 54 L40 18" stroke="#2f9e44" stroke-width="5"/>
            <circle cx="40" cy="12" r="12" fill="#ff6b9a" stroke="#1f2328" stroke-width="3"/>
            <circle cx="22" cy="30" r="9" fill="#ffd43b" stroke="#1f2328" stroke-width="3"/>
            <circle cx="58" cy="30" r="9" fill="#ffd43b" stroke="#1f2328" stroke-width="3"/>
          </g>
        </svg>
      </div>
      <p class="sent">爺爺<b>退休</b>了，每天在家種花。</p>
    </div>
    <div class="card">
      <span class="tag hl p">成語學習</span>
      <div class="word">喋喋不休</div>
      <div class="pic">
        <svg viewBox="0 0 260 170" aria-hidden="true">
          <use href="#kid-girl" x="20" y="44" width="96" height="124"/>
          <g fill="#fff" stroke="#1f2328" stroke-width="3">
            <ellipse cx="160" cy="34" rx="40" ry="24"/><ellipse cx="216" cy="80" rx="36" ry="22"/>
            <ellipse cx="150" cy="114" rx="34" ry="20"/>
          </g>
          <g font-size="22" fill="#1f2328" text-anchor="middle" font-family="sans-serif">
            <text x="160" y="42">嘰嘰</text><text x="216" y="88">喳喳</text><text x="150" y="122">說說</text>
          </g>
        </svg>
      </div>
      <p class="sent">妹妹<b>喋喋不休</b>，說個不停。</p>
    </div>
  </section>

</div></div>

<!-- ===== 角色與素材庫（日式可愛扁平插畫風）：用 <use href="#id"> 重複使用，可依需要新增 ===== -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e5484d"/>
    </marker>
    <!-- 男孩（站） -->
    <symbol id="kid-boy" viewBox="0 0 100 130">
      <rect x="30" y="62" width="40" height="40" rx="12" fill="#4dabf7" stroke="#1f2328" stroke-width="3"/>
      <rect x="34" y="100" width="12" height="26" rx="5" fill="#495057"/><rect x="54" y="100" width="12" height="26" rx="5" fill="#495057"/>
      <circle cx="50" cy="36" r="28" fill="#ffe0c2" stroke="#1f2328" stroke-width="3"/>
      <path d="M22 32 Q26 6 50 8 Q76 6 78 32 Q66 18 50 20 Q34 18 22 32 Z" fill="#3b2f2f"/>
      <circle cx="40" cy="38" r="3.5" fill="#1f2328"/><circle cx="60" cy="38" r="3.5" fill="#1f2328"/>
      <circle cx="33" cy="47" r="5" fill="#ffadad" opacity=".8"/><circle cx="67" cy="47" r="5" fill="#ffadad" opacity=".8"/>
      <path d="M43 50 Q50 56 57 50" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <!-- 女孩（站） -->
    <symbol id="kid-girl" viewBox="0 0 100 130">
      <path d="M28 64 L72 64 L80 106 L20 106 Z" fill="#ff8fab" stroke="#1f2328" stroke-width="3"/>
      <rect x="36" y="104" width="10" height="22" rx="5" fill="#ffe0c2"/><rect x="54" y="104" width="10" height="22" rx="5" fill="#ffe0c2"/>
      <circle cx="20" cy="40" r="11" fill="#3b2f2f"/><circle cx="80" cy="40" r="11" fill="#3b2f2f"/>
      <circle cx="50" cy="38" r="28" fill="#ffe0c2" stroke="#1f2328" stroke-width="3"/>
      <path d="M22 36 Q24 8 50 9 Q76 8 78 36 Q70 22 56 22 L50 28 L44 22 Q30 22 22 36 Z" fill="#3b2f2f"/>
      <circle cx="40" cy="40" r="3.5" fill="#1f2328"/><circle cx="60" cy="40" r="3.5" fill="#1f2328"/>
      <circle cx="33" cy="49" r="5" fill="#ffadad" opacity=".8"/><circle cx="67" cy="49" r="5" fill="#ffadad" opacity=".8"/>
      <ellipse cx="50" cy="53" rx="6" ry="4" fill="#e5484d"/>
    </symbol>
    <!-- 小孩（靠坐休息，閉眼） -->
    <symbol id="kid-rest" viewBox="0 0 120 140">
      <path d="M30 70 Q40 62 70 66 L76 106 L26 106 Z" fill="#4dabf7" stroke="#1f2328" stroke-width="3"/>
      <path d="M30 104 L92 104 Q102 106 100 118 L30 118 Z" fill="#495057"/>
      <circle cx="54" cy="42" r="28" fill="#ffe0c2" stroke="#1f2328" stroke-width="3"/>
      <path d="M26 38 Q30 12 54 14 Q80 12 82 38 Q70 24 54 26 Q38 24 26 38 Z" fill="#3b2f2f"/>
      <path d="M40 44 Q45 48 50 44" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
      <path d="M60 44 Q65 48 70 44" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
      <circle cx="38" cy="53" r="5" fill="#ffadad" opacity=".8"/><circle cx="72" cy="53" r="5" fill="#ffadad" opacity=".8"/>
      <path d="M49 57 Q55 61 61 57" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <!-- 老師（說明角色） -->
    <symbol id="teacher" viewBox="0 0 160 300">
      <path d="M40 140 Q80 120 120 140 L132 260 L28 260 Z" fill="#69db7c" stroke="#1f2328" stroke-width="4"/>
      <path d="M40 150 Q14 120 30 90" fill="none" stroke="#ffe0c2" stroke-width="16" stroke-linecap="round"/>
      <rect x="52" y="258" width="20" height="36" rx="8" fill="#495057"/><rect x="88" y="258" width="20" height="36" rx="8" fill="#495057"/>
      <circle cx="80" cy="82" r="48" fill="#ffe0c2" stroke="#1f2328" stroke-width="4"/>
      <path d="M30 86 Q26 30 80 30 Q134 30 130 86 Q128 120 140 130 L120 130 Q118 66 80 58 Q42 66 40 130 L20 130 Q32 120 30 86 Z" fill="#5c3d2e"/>
      <circle cx="64" cy="88" r="5" fill="#1f2328"/><circle cx="96" cy="88" r="5" fill="#1f2328"/>
      <circle cx="54" cy="104" r="8" fill="#ffadad" opacity=".8"/><circle cx="106" cy="104" r="8" fill="#ffadad" opacity=".8"/>
      <path d="M68 108 Q80 120 92 108" fill="none" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <!-- 爺爺 -->
    <symbol id="grandpa" viewBox="0 0 110 146">
      <rect x="28" y="70" width="54" height="50" rx="14" fill="#b197fc" stroke="#1f2328" stroke-width="3"/>
      <rect x="34" y="118" width="14" height="26" rx="5" fill="#495057"/><rect x="62" y="118" width="14" height="26" rx="5" fill="#495057"/>
      <circle cx="55" cy="40" r="30" fill="#ffe0c2" stroke="#1f2328" stroke-width="3"/>
      <path d="M26 40 Q24 22 34 20 M84 40 Q86 22 76 20" fill="none" stroke="#dee2e6" stroke-width="8" stroke-linecap="round"/>
      <circle cx="44" cy="40" r="7" fill="none" stroke="#1f2328" stroke-width="2.5"/><circle cx="66" cy="40" r="7" fill="none" stroke="#1f2328" stroke-width="2.5"/>
      <path d="M51 40 L59 40" stroke="#1f2328" stroke-width="2.5"/>
      <circle cx="44" cy="40" r="2.5" fill="#1f2328"/><circle cx="66" cy="40" r="2.5" fill="#1f2328"/>
      <path d="M44 54 Q55 62 66 54" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <!-- 大樹 -->
    <symbol id="tree" viewBox="0 0 120 160">
      <rect x="50" y="80" width="22" height="78" rx="6" fill="#a0673f" stroke="#1f2328" stroke-width="3"/>
      <circle cx="60" cy="52" r="44" fill="#51cf66" stroke="#1f2328" stroke-width="3"/>
      <circle cx="30" cy="70" r="24" fill="#40c057" stroke="#1f2328" stroke-width="3"/>
      <circle cx="90" cy="70" r="24" fill="#40c057" stroke="#1f2328" stroke-width="3"/>
      <circle cx="48" cy="40" r="6" fill="#8ce99a"/><circle cx="76" cy="58" r="5" fill="#8ce99a"/>
    </symbol>
    <!-- 太陽 -->
    <symbol id="sun" viewBox="0 0 60 60">
      <g stroke="#f59f00" stroke-width="4" stroke-linecap="round">
        <path d="M30 2 V10 M30 50 V58 M2 30 H10 M50 30 H58 M10 10 L16 16 M44 44 L50 50 M50 10 L44 16 M16 44 L10 50"/>
      </g>
      <circle cx="30" cy="30" r="14" fill="#ffd43b" stroke="#1f2328" stroke-width="3"/>
    </symbol>
  </defs>
</svg>

<script>
// 依視窗大小等比縮放 1920×1080 畫布（列印時改用 @media print 的縮放）
(function(){
  var p=document.getElementById('page');
  function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080)*0.96;p.style.transform='scale('+s+')';}
  addEventListener('resize',fit);fit();
  addEventListener('beforeprint',function(){p.style.transform='none';});
  addEventListener('afterprint',fit);
})();
</script>
</body>
</html>
